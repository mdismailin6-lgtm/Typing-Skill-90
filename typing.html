<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monkeytype Minimalist — TypeSpeed</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/favicon.png" type="image/png">
</head>
<body>

  <div class="page-container">
    <!-- Top Minimal Navigation -->
    <header class="top-nav">
      <a href="index.html" class="brand-badge">
        <span>⌨</span>
        <span>type</span>
      </a>
      <div class="nav-icons">
        <span>📊</span>
        <span>🏆</span>
        <span>ℹ️</span>
        <span>🔔</span>
        <span>👤</span>
      </div>
    </header>

    <!-- Settings Pill Button -->
    <button class="settings-pill-btn" onclick="window.location.href='index.html'">
      <span>⚙</span> test settings
    </button>

    <!-- Language Display -->
    <div class="language-label">
      <span>🌐</span>
      <span id="active-language">english</span>
    </div>

    <!-- Loader / Error Message -->
    <div id="loader-box" style="color: var(--sub-color); margin-top: 30px;">
      loading words...
    </div>

    <!-- Main Typing Stream Area -->
    <main id="typing-zone" class="typing-box" style="display: none;">
      <div class="words-wrapper" id="words-wrapper"></div>
      
      <!-- Ghost Input for Mobile & Desktop Typing -->
      <input 
        type="text" 
        id="ghost-input" 
        class="ghost-input" 
        autocomplete="off" 
        autocorrect="off" 
        autocapitalize="off" 
        spellcheck="false"
      >
    </main>

    <!-- Restart Prompt & Button -->
    <div class="restart-cue">
      <span class="cue-key">tab</span> + <span class="cue-key">enter</span> - restart test
    </div>

    <button id="btn-restart" class="btn-restart-circle" title="Restart Test">
      <svg viewBox="0 0 24 24">
        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.77 20 14.44 20 13c0-4.42-3.58-8-8-8zm-6 8c0-1.01.25-1.97.7-2.8L5.24 8.74C4.46 10.23 4 11.56 4 13c0 4.42 3.58 8 8 8v4l5-5-5-5v4c-3.31 0-6-2.69-6-6z"/>
      </svg>
    </button>

    <!-- Bottom Ad Container -->
    <div class="bottom-ad-bar" id="typing-ad-bottom"></div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/api.js"></script>
  <script src="js/typing.js"></script>
</body>
</html>
