<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeSpeed — Fast & Distraction-Free Typing Test</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/favicon.png" type="image/png">
</head>
<body>

  <div class="container">
    <header>
      <a href="index.html" class="brand">⚡ TypeSpeed</a>
      <span style="font-size: 0.85rem; color: var(--text-muted);">Practice & Test</span>
    </header>

    <!-- Home Safe Ad Placement -->
    <div class="ad-slot" id="home-ad-container"></div>

    <main class="card">
      <!-- Mode Selection (wordAdd vs paragraphAdd) -->
      <div class="form-group">
        <label>টেস্ট মোড (Test Mode)</label>
        <div class="btn-group" id="mode-selector"></div>
      </div>

      <!-- Time Duration Selection -->
      <div class="form-group">
        <label>সময় নির্ধারণ (Duration)</label>
        <div class="btn-group" id="duration-selector"></div>
      </div>

      <!-- Difficulty Selection -->
      <div class="form-group">
        <label>কঠিনতার স্তর (Difficulty)</label>
        <div class="btn-group" id="difficulty-selector"></div>
      </div>

      <!-- Language Selection -->
      <div class="form-group">
        <label>ভাষা (Language)</label>
        <div class="btn-group" id="language-selector"></div>
      </div>

      <button id="btn-start" class="btn-primary" style="margin-top: 10px;">Start Typing Test</button>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/api.js"></script>
  <script>
    const userSelection = {
      mode: CONFIG.DEFAULTS.MODE,
      duration: CONFIG.DEFAULTS.DURATION,
      difficulty: CONFIG.DEFAULTS.DIFFICULTY,
      language: CONFIG.DEFAULTS.LANGUAGE,
      category: CONFIG.DEFAULTS.CATEGORY
    };

    function renderButtonGroup(containerId, items, selectedKey, formatFn = (x) => x) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      items.forEach(item => {
        const val = typeof item === "object" ? (item.id || item.code) : item;
        const label = typeof item === "object" ? item.name : formatFn(item);

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `btn-opt ${val == userSelection[selectedKey] ? "active" : ""}`;
        btn.textContent = label;

        btn.addEventListener("click", () => {
          userSelection[selectedKey] = val;
          Array.from(container.children).forEach(el => el.classList.remove("active"));
          btn.classList.add("active");
        });

        container.appendChild(btn);
      });
    }

    async function initHomePage() {
      // ১. AdSense কনফিগারেশন লোড
      const adConfig = await API.getAdConfig();
      AdManager.setup(adConfig);
      if (adConfig && adConfig.enabled) {
        AdManager.renderBanner("home-ad-container", adConfig.publisherId, CONFIG.FALLBACK_ADS.SLOTS.HOME_TOP);
      }

      // ২. টেস্ট অপশন ডাইনামিক লোড
      const options = await API.getTestOptions();
      renderButtonGroup("mode-selector", options.modes, "mode");
      renderButtonGroup("duration-selector", options.durations, "duration", (d) => `${d}s`);
      renderButtonGroup("difficulty-selector", options.difficulties, "difficulty", (d) => d.toUpperCase());
      renderButtonGroup("language-selector", options.languages, "language");

      // ৩. টেস্ট শুরু হ্যান্ডলার
      document.getElementById("btn-start").addEventListener("click", () => {
        const queryParams = new URLSearchParams(userSelection).toString();
        window.location.href = `typing.html?${queryParams}`;
      });
    }

    document.addEventListener("DOMContentLoaded", initHomePage);
  </script>
</body>
</html>
